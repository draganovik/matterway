name: "matterway-erp-stack"
services:
  matterway-platform-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    container_name: "aspire-dashboard"
    ports:
      - "18888:18888"
    expose:
      - "18889"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRESPASSWORD}"
    ports:
      - "15432:5432"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "matterway-postgres-data"
        read_only: false
    networks:
      - "aspire"
    restart: "unless-stopped"
  minio:
    image: "minio/minio:latest"
    command:
      - "server"
      - "/data"
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIOROOTUSER}"
      MINIO_ROOT_PASSWORD: "${MINIOROOTPASSWORD}"
    ports:
      - "19000:9000"
      - "19001:9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - type: "volume"
        target: "/data"
        source: "matterway-minio-data"
        read_only: false
    networks:
      - "aspire"
    restart: "unless-stopped"
  identity-api:
    image: "${IDENTITY_API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${IDENTITY_API_PORT}"
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRESPASSWORD};Database=IdentityDb"
      IDENTITYDB_HOST: "postgres"
      IDENTITYDB_PORT: "5432"
      IDENTITYDB_USERNAME: "postgres"
      IDENTITYDB_PASSWORD: "${POSTGRESPASSWORD}"
      IDENTITYDB_URI: "postgresql://postgres:${POSTGRESPASSWORD}@postgres:5432/IdentityDb"
      IDENTITYDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/IdentityDb"
      IDENTITYDB_DATABASE: "IdentityDb"
      Jwt__Key: "${JWTSIGNINGKEY}"
      Jwt__Issuer: "http://identity-api:${IDENTITY_API_PORT}"
      Jwt__Audience: "http://identity-api:${IDENTITY_API_PORT}"
      Cors__AllowedOrigins__0: "http://storefront-web:8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://matterway-platform-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "identity-api"
    ports:
      - "2003:8080"
    networks:
      - "aspire"
    restart: "unless-stopped"
  catalog-api:
    image: "${CATALOG_API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${CATALOG_API_PORT}"
      ConnectionStrings__CatalogDb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRESPASSWORD};Database=CatalogDb"
      CATALOGDB_HOST: "postgres"
      CATALOGDB_PORT: "5432"
      CATALOGDB_USERNAME: "postgres"
      CATALOGDB_PASSWORD: "${POSTGRESPASSWORD}"
      CATALOGDB_URI: "postgresql://postgres:${POSTGRESPASSWORD}@postgres:5432/CatalogDb"
      CATALOGDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/CatalogDb"
      CATALOGDB_DATABASE: "CatalogDb"
      IDENTITY-API_HTTP: "http://identity-api:${IDENTITY_API_PORT}"
      services__identity-api__http__0: "http://identity-api:${IDENTITY_API_PORT}"
      MINIO_HTTP: "http://minio:9000"
      services__minio__http__0: "http://minio:9000"
      ImageStorage__Bucket: "product-images"
      ImageStorage__Endpoint: "http://minio:9000"
      ImageStorage__PublicBaseUrl: "http://minio:9000"
      ImageStorage__AccessKey: "${MINIOROOTUSER}"
      ImageStorage__SecretKey: "${MINIOROOTPASSWORD}"
      ImageStorage__AllowPublicRead: "true"
      Jwt__Key: "${JWTSIGNINGKEY}"
      Jwt__Issuer: "http://identity-api:${IDENTITY_API_PORT}"
      Jwt__Audience: "http://identity-api:${IDENTITY_API_PORT}"
      Cors__AllowedOrigins__0: "http://storefront-web:8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://matterway-platform-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "catalog-api"
    ports:
      - "2001:8080"
    depends_on:
      minio:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
  customers-api:
    image: "${CUSTOMERS_API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${CUSTOMERS_API_PORT}"
      ConnectionStrings__CustomersDb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRESPASSWORD};Database=CustomersDb"
      CUSTOMERSDB_HOST: "postgres"
      CUSTOMERSDB_PORT: "5432"
      CUSTOMERSDB_USERNAME: "postgres"
      CUSTOMERSDB_PASSWORD: "${POSTGRESPASSWORD}"
      CUSTOMERSDB_URI: "postgresql://postgres:${POSTGRESPASSWORD}@postgres:5432/CustomersDb"
      CUSTOMERSDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/CustomersDb"
      CUSTOMERSDB_DATABASE: "CustomersDb"
      IDENTITY-API_HTTP: "http://identity-api:${IDENTITY_API_PORT}"
      services__identity-api__http__0: "http://identity-api:${IDENTITY_API_PORT}"
      CATALOG-API_HTTP: "http://catalog-api:${CATALOG_API_PORT}"
      services__catalog-api__http__0: "http://catalog-api:${CATALOG_API_PORT}"
      Jwt__Key: "${JWTSIGNINGKEY}"
      Jwt__Issuer: "http://identity-api:${IDENTITY_API_PORT}"
      Jwt__Audience: "http://identity-api:${IDENTITY_API_PORT}"
      Cors__AllowedOrigins__0: "http://storefront-web:8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://matterway-platform-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "customers-api"
    ports:
      - "2002:8080"
    networks:
      - "aspire"
    restart: "unless-stopped"
  ordering-api:
    image: "${ORDERING_API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${ORDERING_API_PORT}"
      ConnectionStrings__OrderingDb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRESPASSWORD};Database=OrderingDb"
      ORDERINGDB_HOST: "postgres"
      ORDERINGDB_PORT: "5432"
      ORDERINGDB_USERNAME: "postgres"
      ORDERINGDB_PASSWORD: "${POSTGRESPASSWORD}"
      ORDERINGDB_URI: "postgresql://postgres:${POSTGRESPASSWORD}@postgres:5432/OrderingDb"
      ORDERINGDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/OrderingDb"
      ORDERINGDB_DATABASE: "OrderingDb"
      IDENTITY-API_HTTP: "http://identity-api:${IDENTITY_API_PORT}"
      services__identity-api__http__0: "http://identity-api:${IDENTITY_API_PORT}"
      CATALOG-API_HTTP: "http://catalog-api:${CATALOG_API_PORT}"
      services__catalog-api__http__0: "http://catalog-api:${CATALOG_API_PORT}"
      CUSTOMERS-API_HTTP: "http://customers-api:${CUSTOMERS_API_PORT}"
      services__customers-api__http__0: "http://customers-api:${CUSTOMERS_API_PORT}"
      Jwt__Key: "${JWTSIGNINGKEY}"
      Jwt__Issuer: "http://identity-api:${IDENTITY_API_PORT}"
      Jwt__Audience: "http://identity-api:${IDENTITY_API_PORT}"
      Cors__AllowedOrigins__0: "http://storefront-web:8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://matterway-platform-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "ordering-api"
    ports:
      - "2005:8080"
    networks:
      - "aspire"
    restart: "unless-stopped"
  payments-api:
    image: "${PAYMENTS_API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${PAYMENTS_API_PORT}"
      ConnectionStrings__PaymentsDb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRESPASSWORD};Database=PaymentsDb"
      PAYMENTSDB_HOST: "postgres"
      PAYMENTSDB_PORT: "5432"
      PAYMENTSDB_USERNAME: "postgres"
      PAYMENTSDB_PASSWORD: "${POSTGRESPASSWORD}"
      PAYMENTSDB_URI: "postgresql://postgres:${POSTGRESPASSWORD}@postgres:5432/PaymentsDb"
      PAYMENTSDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/PaymentsDb"
      PAYMENTSDB_DATABASE: "PaymentsDb"
      IDENTITY-API_HTTP: "http://identity-api:${IDENTITY_API_PORT}"
      services__identity-api__http__0: "http://identity-api:${IDENTITY_API_PORT}"
      Jwt__Key: "${JWTSIGNINGKEY}"
      Jwt__Issuer: "http://identity-api:${IDENTITY_API_PORT}"
      Jwt__Audience: "http://identity-api:${IDENTITY_API_PORT}"
      Cors__AllowedOrigins__0: "http://storefront-web:8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://matterway-platform-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "payments-api"
    ports:
      - "2006:8080"
    networks:
      - "aspire"
    restart: "unless-stopped"
  storefront-web:
    image: "${STOREFRONT_WEB_IMAGE}"
    environment:
      NODE_ENV: "production"
      PORT: "8000"
      NUXT_SERVER_ORDERING_API_BASE_URL: "http://ordering-api:${ORDERING_API_PORT}"
      NUXT_SERVER_PAYMENTS_API_BASE_URL: "http://payments-api:${PAYMENTS_API_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://matterway-platform-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "storefront-web"
    ports:
      - "3001:8000"
    depends_on:
      catalog-api:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
networks:
  aspire:
    driver: "bridge"
volumes:
  matterway-postgres-data:
    driver: "local"
  matterway-minio-data:
    driver: "local"
