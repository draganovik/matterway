version: '3.4'

services:
  storefront.web:
    container_name: storefront-web
    image: ${DOCKER_REGISTRY-}storefront-web
    environment:
      NUXT_APP_VERSION: '1.0.0'
    command: node /app/.output/server/index.mjs
    tty: true
    build:
      context: src/Storefront.Web
      dockerfile: Dockerfile

  catalog.api:
    container_name: catalog-api
    image: ${DOCKER_REGISTRY-}catalog-api
    build:
      context: .
      dockerfile: src/Catalog.Api/Dockerfile

  customers.api:
    container_name: customers-api
    image: ${DOCKER_REGISTRY-}customers-api
    build:
      context: .
      dockerfile: src/Customers.Api/Dockerfile

  identity.api:
    container_name: identity-api
    image: ${DOCKER_REGISTRY-}identity-api
    build:
      context: .
      dockerfile: src/Identity.Api/Dockerfile

  inventory.api:
    container_name: inventory-api
    image: ${DOCKER_REGISTRY-}inventory-api
    build:
      context: .
      dockerfile: src/Inventory.Api/Dockerfile

  ordering.api:
    container_name: ordering-api
    image: ${DOCKER_REGISTRY-}ordering-api
    build:
      context: .
      dockerfile: src/Ordering.Api/Dockerfile

  payments.api:
    container_name: payments-api
    image: ${DOCKER_REGISTRY-}payments-api
    build:
      context: .
      dockerfile: src/Payments.Api/Dockerfile
